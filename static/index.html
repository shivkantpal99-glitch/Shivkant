
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shivkant Search</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff;
  color: #202124;
}

header {
  text-align: center;
  padding: 90px 15px 20px;
}

.logo {
  font-size: 42px;
  font-weight: bold;
  color: #1769aa;
}

.logo span { color: #159b72; }

.search {
  max-width: 620px;
  margin: 25px auto;
  display: flex;
  border: 1px solid #ddd;
  border-radius: 35px;
  overflow: hidden;
  box-shadow: 0 2px 8px #ddd;
}

.search input {
  flex: 1;
  min-width: 0;
  padding: 16px;
  border: 0;
  outline: none;
  font-size: 16px;
}

.search button {
  border: 0;
  background: #1769aa;
  color: white;
  padding: 0 23px;
  font-size: 16px;
}

#results {
  max-width: 700px;
  margin: 25px auto;
  padding: 0 15px;
}

.result {
  margin-bottom: 25px;
  overflow-wrap: anywhere;
}

.result a {
  color: #1769aa;
  font-size: 19px;
  text-decoration: none;
}

.result p {
  color: #555;
  line-height: 1.5;
}

footer {
  text-align: center;
  color: #777;
  margin: 60px 10px;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    Shivkant <span>Search</span>
  </div>

  <p>पूरी दुनिया में जानकारी खोजें</p>

  <form class="search" id="searchForm">
    <input
      id="query"
      type="search"
      placeholder="यहाँ खोजें..."
      required
    >
    <button type="submit">खोजें</button>
  </form>
</header>

<main id="results">
  <p>Shivkant Search में आपका स्वागत है!</p>
</main>

<footer>
  © 2026 Shivkant Search
</footer>

<script>
const form = document.getElementById("searchForm");
const results = document.getElementById("results");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const q = document.getElementById("query").value.trim();

  if (!q) return;

  results.textContent = "खोज जारी है...";

  try {
    const response = await fetch(
      "/api/search?q=" + encodeURIComponent(q)
    );

    if (!response.ok) {
      throw new Error("Search failed");
    }

    const data = await response.json();
    results.replaceChildren();

    const heading = document.createElement("h3");
    heading.textContent = "खोज परिणाम: " + data.total;
    results.appendChild(heading);

    if (!data.results.length) {
      const message = document.createElement("p");
      message.textContent =
        "अभी कोई परिणाम नहीं मिला।";
      results.appendChild(message);
    }

    data.results.forEach(item => {
      const box = document.createElement("div");
      box.className = "result";

      const link = document.createElement("a");
      link.href = item.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = item.title || item.url;

      const description = document.createElement("p");
      description.textContent =
        item.description || item.url;

      box.append(link, description);
      results.appendChild(box);
    });

  } catch (error) {
    results.textContent =
      "सर्वर से संपर्क नहीं हो पाया।";
  }
});
</script>

</body>
</html>
